# This file is the one-minute CI gate: 1 minute average, 2 minutes max end to end.
# Slow jobs (sanitizers, MSan, arm64, mingw, samples) live in nightly.yml.
# https://docs.github.com/en/actions
name: build_test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 10 }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            test: ./bin/test
          # Optimized runs. The determinism golden hashes are otherwise only checked at -O0,
          # and -O2 is where a value changing float transform would first show up.
          - name: windows-relwithdebinfo
            os: windows-latest
            msvc: true
            config: RelWithDebInfo
            test: ./bin/RelWithDebInfo/test
          - name: macos-relwithdebinfo
            os: macos-latest
            config: RelWithDebInfo
            test: ./bin/test
          - name: ubuntu-gcc-double
            os: ubuntu-latest
            args: -DBOX3D_DOUBLE_PRECISION=ON
            test: ./bin/test
    steps:
    - uses: actions/checkout@v6

    - name: Setup MSVC dev command prompt
      if: ${{ matrix.msvc }}
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ matrix['msvc-arch'] || 'x64' }}

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{ matrix.config || env.BUILD_TYPE }} -DBOX3D_SAMPLES=OFF -DBUILD_SHARED_LIBS=OFF -DBOX3D_VALIDATE=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.args }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.config || env.BUILD_TYPE }} --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        MSAN_OPTIONS: ${{ matrix['msan-options'] || '' }}
        UBSAN_OPTIONS: print_stacktrace=1
      run: ${{ matrix.test }}

  # Build-only: running the wasm test needs a node + pthread/SharedArrayBuffer harness.
  # This still catches compile breaks in the box3d library and the test target.
  emscripten:
    name: emscripten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
    - uses: actions/checkout@v6

    - uses: mymindstorm/setup-emsdk@v14

    - name: Configure CMake
      run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBOX3D_SAMPLES=OFF -DBUILD_SHARED_LIBS=OFF -DBOX3D_VALIDATE=ON

    - name: Build
      run: cmake --build build --config Debug --parallel
